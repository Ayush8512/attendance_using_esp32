<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>IERT Prayagraj — Attendance Management System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0b1324',
                        cardbg: '#141d33',
                        cardborder: '#1f2d4d',
                        accent: '#1e3a8a',
                        highlight: '#2563eb'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-white text-slate-900 font-sans antialiased h-screen flex overflow-hidden selection:bg-blue-600 selection:text-white relative">
    <!-- Ambient 3D Neon Glow Blobs -->
    <div class="glow-blob glow-blob-1"></div>
    <div class="glow-blob glow-blob-2"></div>

    <!-- Interactive 3D Particles Canvas -->
    <canvas id="bg-particles-canvas" class="fixed inset-0 pointer-events-none z-0 opacity-70"></canvas>

    <!-- Navbar/Sidebar Container -->
    <div id="navbar-container" class="z-20 relative"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full z-10">

        <!-- Top header for mobile menu toggle -->
        <header class="md:hidden flex items-center justify-between p-4 bg-white border-b border-slate-200">
            <div class="flex items-center text-sm font-bold text-slate-900 tracking-wider">
                <i class="fas fa-university text-blue-600 mr-2"></i> IERT ATTENDANCE
            </div>
            <button id="mobile-menu-btn" class="text-slate-600 hover:text-slate-900 focus:outline-none">
                <i class="fas fa-bars text-xl"></i>
            </button>
        </header>

        <!-- Dynamic Page Content -->
        <div id="app" class="flex-1 overflow-y-auto p-4 md:p-8 bg-slate-50/50">
            <!-- Loading indicator initially -->
            <div class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-10 w-10 border-t-2 border-b-2 border-blue-600"></div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application Scripts -->
    <script type="module" src="js/app.js?v=1.3"></script>
</body>
</html>
