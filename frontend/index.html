<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Attendance System</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#1a1a2e',
                        cardbg: '#16213e',
                        accent: '#0f3460',
                        highlight: '#e94560'
                    }
                }
            }
        }
    </script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-darkbg text-gray-200 font-sans antialiased h-screen flex overflow-hidden selection:bg-highlight selection:text-white">
    <!-- Navbar/Sidebar Container -->
    <div id="navbar-container" class="z-20"></div>

    <!-- Main Content Area -->
    <main class="flex-1 flex flex-col h-full overflow-hidden relative w-full">
        <!-- Top header for mobile menu toggle -->
        <header class="md:hidden flex items-center justify-between p-4 bg-cardbg border-b border-gray-700">
            <div class="flex items-center text-xl font-bold text-white">
                <i class="fas fa-id-badge text-highlight mr-2"></i> SAS
            </div>
            <button id="mobile-menu-btn" class="text-gray-300 hover:text-white focus:outline-none">
                <i class="fas fa-bars text-2xl"></i>
            </button>
        </header>

        <!-- Dynamic Page Content -->
        <div id="app" class="flex-1 overflow-y-auto p-4 md:p-8 bg-darkbg">
            <!-- Loading indicator initially -->
            <div class="flex items-center justify-center h-full">
                <div class="animate-spin rounded-full h-12 w-12 border-t-2 border-b-2 border-highlight"></div>
            </div>
        </div>
    </main>

    <!-- Toast Notification Container -->
    <div id="toast-container" class="fixed bottom-4 right-4 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <!-- Application Scripts -->
    <script type="module" src="js/app.js?v=1.2"></script>
</body>
</html>
