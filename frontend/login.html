<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Faculty & Admin Login — IERT Attendance Portal</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #0b1324;
            color: #e2e8f0;
            padding: 1rem;
        }
        .login-card {
            background-color: #141d33;
            padding: 2.25rem;
            border-radius: 12px;
            border: 1px solid #1f2d4d;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 420px;
        }
        .logo {
            text-align: center;
            margin-bottom: 1.75rem;
        }
        .logo svg {
            width: 50px;
            height: 50px;
            fill: #2563eb;
            margin-bottom: 0.75rem;
        }
        .hint-box {
            background-color: rgba(30, 58, 138, 0.25);
            border: 1px solid rgba(59, 130, 246, 0.3);
            border-radius: 8px;
            font-size: 0.8rem;
            padding: 0.75rem;
            margin-top: 1.25rem;
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="logo">
            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 3c1.66 0 3 1.34 3 3s-1.34 3-3 3-3-1.34-3-3 1.34-3 3-3zm0 14.2c-2.5 0-4.71-1.28-6-3.22.03-1.99 4-3.08 6-3.08 1.99 0 5.97 1.09 6 3.08-1.29 1.94-3.5 3.22-6 3.22z"/></svg>
            <h4 class="fw-bold text-white tracking-wide">IERT PRAYAGRAJ</h4>
            <p class="text-secondary small mb-0">Smart Attendance Portal &bull; Multi-Teacher Login</p>
        </div>
        
        <form id="loginForm">
            <div class="mb-3">
                <label class="form-label text-light small fw-semibold">Email or Username</label>
                <input type="text" id="username" class="form-control bg-dark text-white border-secondary" required placeholder="e.g. gupta@college.edu or admin">
            </div>
            <div class="mb-3">
                <div class="d-flex justify-content-between align-items-center mb-1">
                    <label class="form-label text-light small fw-semibold mb-0">Password</label>
                    <a href="#" id="forgotPasswordBtn" class="small text-decoration-none text-info">Forgot Password?</a>
                </div>
                <input type="password" id="password" class="form-control bg-dark text-white border-secondary" required placeholder="Enter password">
            </div>
            <button type="submit" class="btn btn-primary w-100 fw-bold py-2">Login to Dashboard</button>
            <div id="errorMsg" class="text-danger text-center mt-3 small" style="display: none;"></div>
        </form>

        <div class="hint-box text-secondary">
            <strong class="text-light">Default Logins for Testing:</strong>
            <ul class="mb-0 ps-3 mt-1">
                <li><strong>Admin</strong>: <code>admin</code> / <code>admin123</code></li>
                <li><strong>Teacher</strong>: <code>gupta@college.edu</code> / <code>teacher123</code></li>
            </ul>
        </div>
    </div>

    <!-- Forgot Password Modal -->
    <div class="modal fade" id="forgotModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content bg-dark text-light border-secondary">
                <div class="modal-header border-secondary">
                    <h5 class="modal-title text-white fw-bold">Reset Password</h5>
                    <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <form id="forgotForm">
                    <div class="modal-body">
                        <p class="small text-secondary mb-3">Enter your registered faculty email address and your new desired password.</p>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">Registered Email</label>
                            <input type="email" id="forgotEmail" class="form-control bg-dark text-white border-secondary" required placeholder="e.g. gupta@college.edu">
                        </div>
                        <div class="mb-3">
                            <label class="form-label small fw-semibold">New Password</label>
                            <input type="password" id="forgotNewPassword" class="form-control bg-dark text-white border-secondary" required minlength="4" placeholder="Minimum 4 characters">
                        </div>
                        <div id="forgotMsg" class="small mt-2 text-center" style="display: none;"></div>
                    </div>
                    <div class="modal-footer border-secondary">
                        <button type="button" class="btn btn-outline-secondary btn-sm" data-bs-dismiss="modal">Cancel</button>
                        <button type="submit" id="forgotSubmitBtn" class="btn btn-warning btn-sm fw-bold">Reset Password</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const forgotModal = new bootstrap.Modal(document.getElementById('forgotModal'));
        document.getElementById('forgotPasswordBtn').addEventListener('click', (e) => {
            e.preventDefault();
            document.getElementById('forgotMsg').style.display = 'none';
            document.getElementById('forgotForm').reset();
            forgotModal.show();
        });

        document.getElementById('forgotForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('forgotSubmitBtn');
            const msgDiv = document.getElementById('forgotMsg');
            const email = document.getElementById('forgotEmail').value.trim();
            const newPassword = document.getElementById('forgotNewPassword').value.trim();

            btn.disabled = true;
            btn.innerText = 'Resetting...';
            msgDiv.style.display = 'none';

            try {
                const response = await fetch('/api/auth/forgot-password', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, new_password: newPassword })
                });

                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    msgDiv.className = 'small mt-2 text-center text-success';
                    msgDiv.innerText = data.message || 'Password reset successful! You can now log in.';
                    msgDiv.style.display = 'block';
                    setTimeout(() => {
                        forgotModal.hide();
                    }, 2000);
                } else {
                    msgDiv.className = 'small mt-2 text-center text-danger';
                    msgDiv.innerText = data.detail || data.message || 'Failed to reset password.';
                    msgDiv.style.display = 'block';
                }
            } catch (err) {
                msgDiv.className = 'small mt-2 text-center text-danger';
                msgDiv.innerText = 'Network error. Please try again.';
                msgDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Reset Password';
            }
        });

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const errorDiv = document.getElementById('errorMsg');
            
            btn.disabled = true;
            btn.innerText = 'Authenticating...';
            errorDiv.style.display = 'none';

            try {
                const response = await fetch('/api/auth/login', {
                    method: 'POST', credentials: 'include',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value
                    })
                });

                const data = await response.json();
                if (response.ok && data.status === 'success') {
                    if (data.user) {
                        localStorage.setItem('currentUser', JSON.stringify(data.user));
                    }
                    window.location.href = '/';
                } else {
                    errorDiv.innerText = data.detail || data.message || 'Invalid username or password';
                    errorDiv.style.display = 'block';
                }
            } catch (err) {
                errorDiv.innerText = 'Network connection error. Please try again.';
                errorDiv.style.display = 'block';
            } finally {
                btn.disabled = false;
                btn.innerText = 'Login to Dashboard';
            }
        });
    </script>
</body>
</html>
